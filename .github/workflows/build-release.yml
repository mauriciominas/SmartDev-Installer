name: Build and attach installers

# Compila os dois executaveis com PyInstaller e publica na release da tag.
# - push de uma tag v*  -> compila, cria (ou atualiza) a release e anexa os .exe
# - execucao manual     -> compila e publica apenas como artifact, sem tocar em release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: en
            name: SmartDev-Installer-EN
          - dir: pt_br
            name: SmartDev-Installer-pt-BR

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instala dependencias de build
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter

      - name: Compila ${{ matrix.name }}.exe
        shell: bash
        working-directory: ${{ matrix.dir }}
        run: |
          pyinstaller \
            --onefile \
            --windowed \
            --uac-admin \
            --clean \
            --noconfirm \
            --name "${{ matrix.name }}" \
            --add-data "smartdev_installer.bat;." \
            --collect-all customtkinter \
            gui_app.py

      - name: Confere que o binario saiu
        shell: bash
        working-directory: ${{ matrix.dir }}
        run: |
          test -f "dist/${{ matrix.name }}.exe"
          ls -la "dist/${{ matrix.name }}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.dir }}/dist/${{ matrix.name }}.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Cria ou atualiza a release da tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la dist
          test -f "dist/SmartDev-Installer-EN.exe"
          test -f "dist/SmartDev-Installer-pt-BR.exe"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.exe --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.exe --title "SmartDev Installer $GITHUB_REF_NAME" --generate-notes
          fi
