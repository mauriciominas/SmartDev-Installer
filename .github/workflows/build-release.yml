name: Build and attach installers

# Compila os dois executaveis com PyInstaller e anexa a release da tag.
# - push de uma tag v*  -> compila e anexa os .exe a release correspondente
# - execucao manual     -> compila e publica apenas como artifact, sem tocar em release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: en
            name: SmartDev-Installer-EN
          - dir: pt_br
            name: SmartDev-Installer-pt-BR

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instala dependencias de build
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter

      - name: Compila ${{ matrix.name }}.exe
        shell: bash
        working-directory: ${{ matrix.dir }}
        run: |
          pyinstaller \
            --onefile \
            --windowed \
            --clean \
            --noconfirm \
            --name "${{ matrix.name }}" \
            --add-data "smartdev_installer.bat;." \
            --collect-all customtkinter \
            gui_app.py

      - name: Confere que o binario saiu
        shell: bash
        working-directory: ${{ matrix.dir }}
        run: |
          test -f "dist/${{ matrix.name }}.exe"
          ls -la "dist/${{ matrix.name }}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.dir }}/dist/${{ matrix.name }}.exe
          if-no-files-found: error

      - name: Anexa a release da tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        working-directory: ${{ matrix.dir }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "dist/${{ matrix.name }}.exe" --clobber
